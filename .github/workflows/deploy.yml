name: 수집 및 배포

# 공공데이터포털(apis.data.go.kr)이 해외 IP 를 차단하므로
# GitHub Actions(해외 서버)에서는 수집할 수 없다.
# 수집은 한국 PC 에서 `수집후배포.ps1` 로 돌리고, 여기서는 검증·배포만 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 분류 로직 점검
        run: python tests.py
        working-directory: collector

      - name: 수집 데이터 확인
        run: |
          if [ -f site/data/events.json ]; then
            echo "저장소에 커밋된 events.json 으로 배포합니다."
          else
            echo "::warning::events.json 이 없어 예시 데이터로 배포합니다."
            echo "한국 PC에서 수집후배포.ps1 을 실행해 실데이터를 올리세요."
            cd collector && python mockgen.py
          fi

      - name: 수집 결과 확인
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("site/data/events.json", encoding="utf-8"))
          n = len(d.get("items", []))
          print(f"공고 {n}건" + (" (예시 데이터)" if d.get("mock") else ""))
          if n == 0:
              print("::error::공고가 0건입니다. 수집 결과를 확인하세요.")
              sys.exit(1)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
